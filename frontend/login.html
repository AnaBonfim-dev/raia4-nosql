<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso-Raia4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Raia 4</h1>
        <p>Entre na sua conta ou cadastre-se para acompanhar seus treinos</p>
    </header>

    <main class="container-login">
        <section>
            <h2 id="tituloAcesso">Entrar no Raia 4</h2>

            <form id="formLogin">
                <div id="campoNomeGrupo" style="display: none;">
                    <label for="nome">Nome do Nadador</label>
                    <input type="text" id="nome" placeholder="Ex: Ana Bonfim">
                </div>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="******" required>

                <button type="submit" id="btnAcesso">Entrar</button>
            </form>

            <p style="margin-top: 15px; text-align: center;">
                <a href="#" id="alternarModo">Não tem conta? Cadastre-se aqui</a>
            </p>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
